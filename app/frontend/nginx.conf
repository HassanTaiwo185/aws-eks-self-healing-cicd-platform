server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite adds content hashes to asset filenames, so cache them aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}