# Argo CD watches k8s/overlays/prod on main and keeps the cluster matching Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: collabsup
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/HassanTaiwo185/aws-eks-self-healing-cicd-platform.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: collabsup
  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # revert manual changes (kubectl edit) back to what Git says
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
