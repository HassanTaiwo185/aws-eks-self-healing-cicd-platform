# One internet-facing ALB. Requires the AWS Load Balancer Controller in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabsup
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip          # route straight to pod IPs (VPC CNI)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # long idle timeout so WebSocket connections are not cut after 60s
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
