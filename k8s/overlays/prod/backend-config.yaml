# Non-secret settings. Secrets (DB_PASSWORD, SECRET_KEY, BREVO_API_KEY) live in
# the "backend-secrets" Secret, which is NOT stored in Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"   # created first, before the migration job
data:
  DEBUG: "False"
  DB_HOST: "cloudnative-postgres.cyv8auwy0hqf.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "appdb"
  DB_USER: "appadmin"
  REDIS_URL: "rediss://master.cloudnative-redis.cwchy1.use1.cache.amazonaws.com:6379/0"
  CELERY_BROKER_URL: "rediss://master.cloudnative-redis.cwchy1.use1.cache.amazonaws.com:6379/0?ssl_cert_reqs=required"
  # Update both once the ALB exists (kubectl get ingress -n collabsup)
  FRONTEND_URL: "ws://k8s-collabsu-collabsu-f9e7369d20-115437088.us-east-1.elb.amazonaws.com/"
  ALLOWED_HOSTS: ".elb.amazonaws.com,localhost"
